name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Show flet-desktop viewer path
        shell: pwsh
        run: |
          python -c "
          import flet_desktop, os
          pkg = os.path.dirname(flet_desktop.__file__)
          print('flet_desktop dir:', pkg)
          for r, d, files in os.walk(pkg):
              for f in files:
                  print(' ', os.path.join(r, f))
          "

      - name: Build executable
        shell: pwsh
        run: |
          # flet viewer binary path (flet-desktop 패키지 내부)
          $viewerSrc = python -c "
          import flet_desktop, os
          pkg = os.path.dirname(flet_desktop.__file__)
          for r, d, files in os.walk(pkg):
              for f in files:
                  if f.lower() == 'flet.exe':
                      print(os.path.join(r, f))
          "
          $viewerSrc = $viewerSrc.Trim()

          $commonArgs = @(
            "app.py",
            "--name", "조달청알리미",
            "--onefile",
            "--windowed",
            "--collect-all", "flet",
            "--collect-all", "flet_desktop",
            "--hidden-import", "flet",
            "--hidden-import", "flet_desktop",
            "--hidden-import", "keyring.backends.Windows",
            "--hidden-import", "APScheduler"
          )

          if (Test-Path "assets/icon.ico") {
            $commonArgs += @("--icon", "assets\icon.ico")
          }

          if ($viewerSrc -and (Test-Path $viewerSrc)) {
            Write-Host "Bundling flet viewer: $viewerSrc"
            $commonArgs += @("--add-data", "${viewerSrc};flet\bin")
          } else {
            Write-Host "flet.exe not found — skipping viewer bundle"
          }

          Write-Host "Running: python -m PyInstaller $commonArgs"
          & python -m PyInstaller @commonArgs

      - name: Verify build output
        run: dir dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 조달청알리미-windows
          path: dist/조달청알리미.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/조달청알리미.exe
          name: "조달청알리미 ${{ github.ref_name }}"
          body: |
            ## 조달청알리미 ${{ github.ref_name }}

            ### 설치 방법
            1. `조달청알리미.exe` 다운로드
            2. 실행 (별도 설치 불필요)

            ### 시스템 요구사항
            - Windows 10 / 11 (64비트)
