name: Build Windows Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "버전 (예: 1.0.0)"
        required: false
        default: "1.0.0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flet-desktop==0.85.2
          pip install pyinstaller

      - name: Pre-download flet Windows viewer into package
        shell: pwsh
        run: |
          # flet_desktop/app/ 폴더에 flet-windows.zip을 넣으면
          # ensure_client_cached()가 인터넷 다운로드 대신 번들 zip을 사용함
          $appDir = python -c "import flet_desktop, os; print(os.path.join(os.path.dirname(flet_desktop.__file__), 'app'))"
          $appDir = $appDir.Trim()
          Write-Host "flet_desktop app dir: $appDir"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null

          $ver = "0.85.2"
          $url = "https://github.com/flet-dev/flet/releases/download/v${ver}/flet-windows.zip"
          $dest = "$appDir\flet-windows.zip"
          Write-Host "Downloading $url -> $dest"
          Invoke-WebRequest -Uri $url -OutFile $dest
          Write-Host "Download complete: $(Get-Item $dest | Select-Object -ExpandProperty Length) bytes"

      - name: Build executable
        shell: pwsh
        run: |
          $buildArgs = @(
            "app.py",
            "--name", "조달청알리미",
            "--onefile",
            "--windowed",
            "--collect-all", "flet",
            "--collect-all", "flet_desktop",
            "--hidden-import", "flet",
            "--hidden-import", "keyring.backends.Windows",
            "--hidden-import", "APScheduler"
          )

          if (Test-Path "assets/icon.ico") {
            $buildArgs += @("--icon", "assets\icon.ico")
          }

          Write-Host "Running: python -m PyInstaller $buildArgs"
          & python -m PyInstaller @buildArgs

      - name: Verify build output
        run: dir dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 조달청알리미-windows
          path: dist/조달청알리미.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/조달청알리미.exe
          name: "조달청알리미 ${{ github.ref_name }}"
          body: |
            ## 조달청알리미 ${{ github.ref_name }}

            ### 설치 방법
            1. `조달청알리미.exe` 다운로드
            2. 실행 (별도 설치 불필요)

            ### 시스템 요구사항
            - Windows 10 / 11 (64비트)
